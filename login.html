<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>ESCAPE.EXE – Login</title>
    <link rel="stylesheet" href="style-login.css" />
  </head>

  <body>
    <div class="login-page">
      <header class="topbar">
        <span>ESCAPE.EXE</span>
        <span>LOGIN TERMINAL</span>
      </header>

      <main class="login-center">
        <section class="login-box">
          <div class="lock">▣</div>

          <h1>SYSTEM ACCESS REQUIRED</h1>
          <p>– BITTE ANMELDUNGSDATEN EINGEBEN –</p>

          <form onsubmit="startGame(event)">
            <label>BENUTZER-ID</label>
            <div class="input-box">
              <span>♙</span>
              <input type="text" placeholder="Benutzer-ID eingeben..." />
            </div>

            <label>ZUGRIFFSCODE</label>
            <div class="input-box">
              <span>▣</span>
              <input type="password" placeholder="Zugriffscode eingeben..." />
              <span>◉</span>
            </div>

            <button type="submit">› SYSTEM STARTEN ‹</button>
          </form>
        </section>

        <section class="status-box">
          <h3>SYSTEM STATUS</h3>
          <p>› Verbindung instabil ...</p>
          <div class="signal"></div>
        </section>
      </main>
    </div>

    <script>
      function startGame(event) {
        event.preventDefault();
        window.location.href = "raum1.html";
      }
    </script>
  </body>
</html>
